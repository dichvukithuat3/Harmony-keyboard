name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make sure the needed SDK pieces are present
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Fails the build before packaging if the Telex/VNI rules ever regress.
      - name: Run Vietnamese engine tests
        run: |
          mkdir -p build/enginetest
          javac -encoding UTF-8 -d build/enginetest \
            app/src/main/java/com/hakeyboard/core/VietnameseEngine.java \
            tools/EngineTest.java
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp build/enginetest EngineTest

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: name
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "BanPhimHa-v1.0.${{ github.run_number }}.apk"
          ls -lh BanPhimHa-*.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanPhimHa-apk
          path: BanPhimHa-*.apk
          if-no-files-found: error

      # A Release is the easy path: the download link opens straight from the
      # phone's browser, no GitHub login needed.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bàn phím Hà v1.0.${{ github.run_number }}
          body: |
            Bàn phím Tiếng Việt (Telex + VNI) cho Android / HarmonyOS 4.x.

            Tải file `.apk` bên dưới về điện thoại rồi mở ra để cài.
            Sau khi cài: mở app **Bàn phím Hà** → làm theo 3 bước trên màn hình.
          files: BanPhimHa-*.apk
